experiment:
  name: lv_discrete_rich_example
  random_seed: 1201

model:
  type: lv_discrete

community:
  richness: 5
  replicates: 2

traits:
  birth_maximum:
    mean: 0.32
    range: 0.04
    distribution: random_uniform
  birth_optimum:
    mean: 20
    range: 8
    distribution: random_uniform
  birth_width:
    mean: 8
    range: 2
    distribution: random_uniform
  death:
    intercept: 0.02
    temperature_slope: 0.03

interactions:
  treatments:
    - label: no_interactions
      type: none
      diagonal: 1
    - label: weak_asymmetric_competition
      type: competition
      symmetry: asymmetric
      distribution: uniform
      parameters:
        min: 0.02
        max: 0.12
      diagonal: 1
    - label: stronger_symmetric_competition
      type: competition
      symmetry: symmetric
      distribution: uniform
      parameters:
        min: 0.08
        max: 0.22
      diagonal: 1

environment:
  replicates: 2
  sharing: same_per_replicate
  temperature:
    mean: 20
    sd: 1
    one_over_f_gamma: 0.8

simulation:
  burn_in_duration: 100
  experiment_duration: 300
  immigration_rate: 0.1

output:
  save_dynamics: true
  dynamics_save_every: 5
  summary_checkpoint_every: 10
  runtime_update_every: 100
  simulation_progress: true
  environment_progress: true

parallel:
  workers: 2
  environments: true
  simulations: true
  community_measures: true

treatments:
  values:
    traits.birth_width.range: [2, 6]
    environment.temperature.sd: [0.5, 1.5]
